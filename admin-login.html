<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Admin - Mmh Restaurant</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary: #8B0000;
            --gold: #D4AF37;
        }
        body {
            background: url('https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&w=1470&q=80') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        .password-input {
            padding-right: 40px;
            width: calc(100% - 45px);
            display: inline-block;
        }
        .password-wrapper {
            display: flex;
            align-items: center;
        }
        .toggle-password {
            margin-left: 10px;
            cursor: pointer;
            color: var(--primary);
            font-size: 1.2rem;
        }
        .btn-primary {
            background-color: var(--primary);
            border: none;
        }
        .form-check-input:checked {
            background-color: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="login-card p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold" style="color: var(--primary);">MMH RESTAURANT</h2>
                        <p class="text-muted">Interface Administrateur</p>
                    </div>
                    
                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control" id="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label">Mot de passe</label>
                            <div class="password-wrapper">
                                <input type="password" class="form-control password-input" id="password" required>
                                <i class="bi bi-eye-fill toggle-password" id="togglePassword"></i>
                            </div>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="rememberMe">
                            <label class="form-check-label" for="rememberMe">Rester connecté</label>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2">Se connecter</button>
                    </form>
                    
                    <div id="loginError" class="alert alert-danger mt-3 d-none"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        // Initialisation Firebase : firebase-config.js s'il est présent,
        // sinon la copie ci-dessous (la page reste fonctionnelle sans ce fichier).
        const MMH_CONFIG = (typeof firebaseConfig !== 'undefined') ? firebaseConfig : {
            apiKey: "AIzaSyDd24327mfgTZZ7IvvB0TYNIBfn8AKmd-w",
            authDomain: "mmh-resto.firebaseapp.com",
            projectId: "mmh-resto",
            storageBucket: "mmh-resto.firebasestorage.app",
            messagingSenderId: "831695759118",
            appId: "1:831695759118:web:45a25ce77b0a5289c3995f"
        };
        firebase.initializeApp(MMH_CONFIG);
        const auth = firebase.auth();

        // Au chargement de la page
        document.addEventListener('DOMContentLoaded', function() {
            const rememberMe = localStorage.getItem('rememberMe') === 'true';
            document.getElementById('rememberMe').checked = rememberMe;
            
            if (rememberMe) {
                const savedEmail = localStorage.getItem('adminEmail');
                if (savedEmail) {
                    document.getElementById('email').value = savedEmail;
                    document.getElementById('password').focus();
                }
            }
        });

        // Gestion de l'œil pour afficher/masquer le mot de passe
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('bi-eye-slash-fill');
        });

        // Gestion de la connexion
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const rememberMe = document.getElementById('rememberMe').checked;
            const errorEl = document.getElementById('loginError');

            // Sauvegarde des préférences
            localStorage.setItem('rememberMe', rememberMe);
            if (rememberMe) {
                localStorage.setItem('adminEmail', email);
            } else {
                localStorage.removeItem('adminEmail');
            }

            try {
                // Configuration de la persistance
                await auth.setPersistence(
                    rememberMe 
                        ? firebase.auth.Auth.Persistence.LOCAL 
                        : firebase.auth.Auth.Persistence.SESSION
                );

                // Connexion
                await auth.signInWithEmailAndPassword(email, password);

                // Indice pour l'affichage instantané de l'admin (évite le flash au chargement)
                try { localStorage.setItem('mmh_admin_session', '1'); } catch (e) {}

                // Redirection
                window.location.href = "admin.html";
            } catch (error) {
                errorEl.textContent = "Identifiants incorrects ou problème de connexion.";
                errorEl.classList.remove('d-none');
                console.error(error);
            }
        });

        // Redirection si déjà connecté
        auth.onAuthStateChanged((user) => {
            if (user && window.location.pathname.endsWith('admin-login.html')) {
                window.location.href = "admin.html";
            }
        });
    </script>
</body>
</html>
